name: Build Desktop App

# Builds the MineDesk Windows desktop app (frontend/src-tauri) from source on
# a clean GitHub-hosted runner - this is the "trusted build system" a code
# signing service (SignPath) verifies against, so a release is only ever
# built here, never signed from a developer's own machine.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows Remote Agent (sidecar)
        working-directory: backend/agent
        run: cargo build --release

      - name: Stage agent as Tauri sidecar
        run: |
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries | Out-Null
          Copy-Item backend/agent/target/release/minedesk-agent.exe frontend/src-tauri/binaries/minedesk-agent-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build desktop app + installers
        working-directory: frontend
        run: npm run build:desktop

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minedesk-desktop-installers
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
