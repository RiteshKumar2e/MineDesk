# coturn configuration for MineDesk local development.
#
# Production deployments should run coturn on a host with a public IP (TURN
# relays media, so it cannot sit behind the same NAT it exists to work around)
# and set `external-ip` to that address. See docs in the README for the
# production TURN checklist.

listening-port=3478
fingerprint

# Long-term credential mechanism, driven by the same shared secret the API
# uses to mint ephemeral per-session credentials (TURN_STATIC_SECRET). No
# static username/password pair is configured - every credential expires.
use-auth-secret
static-auth-secret=change-me-turn-static-secret-must-match-env
realm=minedesk.local

# Relay port range. Keep this in sync with the ports published in
# docker-compose.yml.
min-port=49160
max-port=49200

# Local development only: real deployments should supply a certificate and
# enable TLS (cert=/path/fullchain.pem, pkey=/path/privkey.pem, tls-listening-port=5349)
# so TURN traffic is not trivially inspectable on hostile networks.
no-tls
no-dtls

# coturn does not need to relay traffic back to the machines it runs on.
no-loopback-peers
no-multicast-peers

# Verbose enough to debug allocation failures without logging packet payloads.
verbose
log-file=stdout
