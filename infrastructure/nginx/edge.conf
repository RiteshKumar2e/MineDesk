# Optional single-host reverse proxy: fronts both the web and API containers
# with one TLS certificate. Not used by docker-compose.yml (which exposes web
# and api on separate ports for local development) - this is for a
# single-VM production deployment. Point your DNS at this host and terminate
# TLS here (certbot, or your load balancer of choice).
#
# WebSocket upgrade headers matter only for /signal: that is the one route
# carrying a long-lived connection. Nothing about a WebRTC media path runs
# through nginx - the browser and the agent negotiate that directly (or via
# coturn), so nginx never has to be tuned for large binary payloads here.

upstream minedesk_api {
    server api:4000;
}

upstream minedesk_web {
    server web:80;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name minedesk.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location /signal {
        proxy_pass http://minedesk_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Signaling sockets are long-lived but idle between frames; keep them
        # open rather than letting a default proxy timeout drop them.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://minedesk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://minedesk_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
