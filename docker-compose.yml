# MineDesk development stack.
#   docker compose up -d              # everything
#   docker compose up -d coturn         # infra only, run api/web on the host
#
# There is no Postgres service: the database is SQLite/libSQL (Turso), which
# for local development is just a file (see RUN.md / backend/.env's
# DATABASE_URL) - nothing to containerize. A real Turso database needs no
# local service either. Presence, signaling and rate limiting are all
# in-process now too (see backend/src/lib/store.ts) - no Redis/cache service
# to run. coturn (TURN) remains a real, optional service.
name: minedesk

services:
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: minedesk-coturn
    restart: unless-stopped
    # host networking lets coturn see real client addresses; on Windows/macOS Docker
    # Desktop this falls back to published ports (fine for LAN development).
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./backend/infrastructure/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  api:
    build:
      context: ./backend
    container_name: minedesk-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      # A local file inside the named volume below by default, so the
      # database survives container recreation. Point this at a real
      # libsql://<name>.turso.io URL (with DATABASE_AUTH_TOKEN) instead to
      # use hosted Turso and drop the volume entirely.
      DATABASE_URL: ${DATABASE_URL:-file:./db/data/dev.db}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET}
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-console}
      STUN_SERVER: ${STUN_SERVER:-stun:localhost:3478}
      TURN_SERVER: ${TURN_SERVER:-turn:localhost:3478}
      TURN_STATIC_SECRET: ${TURN_STATIC_SECRET}
      TURN_REALM: ${TURN_REALM:-minedesk.local}
    volumes:
      - api-db-data:/app/db/data
    ports:
      - "4000:4000"
    profiles: ["full"]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:4000}
    container_name: minedesk-web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8080:80"
    profiles: ["full"]

volumes:
  api-db-data:
