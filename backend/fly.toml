# Fly.io config for the MineDesk API. See DEPLOY.md for the full walkthrough.
#
# Why Fly.io and not Vercel for this half: the API holds the signaling
# WebSocket connections (agents and browsers stay connected for the life of
# a session) and needs a real, long-running Node process - Vercel's
# serverless functions are not a fit for that, however well they suit the
# static web frontend (see DEPLOY.md's web section).
app = "minedesk-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  API_HOST = "0.0.0.0"
  API_PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "15s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"
